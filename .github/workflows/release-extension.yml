name: Release extension

on:
  push:
    tags:
      - highlighter
      - 'highlighter-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm version
        run: npm install --global npm@10.9.9

      - run: npm ci

      - name: Check tag matches extension version
        id: version
        shell: bash
        run: |
          manifest_version="$(node -p "require('./extension/manifest.json').version")"
          if [[ "$GITHUB_REF_NAME" == "highlighter" ]]; then
            tag_version="$manifest_version"
          elif [[ "$GITHUB_REF_NAME" =~ ^highlighter-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tag_version="${BASH_REMATCH[1]}"
          else
            echo "Tag must be highlighter or use the format highlighter-vX.Y.Z." >&2
            exit 1
          fi
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag version $tag_version does not match extension/manifest.json ($manifest_version)." >&2
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: npm run build:extension

      - name: Create ZIP package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          (cd dist/extension && zip -qr "$GITHUB_WORKSPACE/release/Highlighter-Extension-${VERSION}.zip" .)

      - name: Create signed CRX package (optional)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CRX_PRIVATE_KEY_B64: ${{ secrets.HIGHLIGHTER_CRX_PRIVATE_KEY_B64 }}
        run: |
          if [[ -z "$CRX_PRIVATE_KEY_B64" ]]; then
            echo "::notice::CRX package skipped. Configure HIGHLIGHTER_CRX_PRIVATE_KEY_B64 to publish a signed CRX."
            exit 0
          fi

          key_path="$RUNNER_TEMP/highlighter.pem"
          printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          google-chrome --headless --no-sandbox --disable-gpu \
            --pack-extension="$GITHUB_WORKSPACE/dist/extension" \
            --pack-extension-key="$key_path"
          mv "$GITHUB_WORKSPACE/dist/extension.crx" \
            "$GITHUB_WORKSPACE/release/Highlighter-Extension-${VERSION}.crx"
          rm -f "$key_path"

      - name: Create concise release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Download the Highlighter-Extension-${VERSION}.zip asset below. Extract it, then choose Load unpacked in chrome://extensions (Chrome) or edge://extensions (Edge) and select the folder containing manifest.json.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --title "Highlighter Extension v${VERSION}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --latest
