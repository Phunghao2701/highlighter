<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Highlighter</title>
        <link rel="stylesheet" href="popup.css">
    </head>
    <body>
        <main class="popup">
            <header class="popup__brand">
                <img src="icons/icon-32.png" alt="" width="32" height="32">
                <span>Highlighter</span>
            </header>
            <h1>Share highlights</h1>
            <p class="popup__hint">Right-click selected text and choose <strong>Highlight selection</strong>. Then share all highlights on this page. Recipients can open the link in Chrome or Edge without installing this extension.</p>

            <button class="popup__create" id="share-all" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
                    <path d="m8.6 10.7 6.8-4.1M8.6 13.3l6.8 4.1" />
                    <circle cx="6" cy="12" r="3" />
                    <circle cx="18" cy="5" r="3" />
                    <circle cx="18" cy="19" r="3" />
                </svg>
                <span id="share-label">Share all highlights</span>
            </button>

            <p class="popup__toast" id="status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        </main>
        <script src="popup.js"></script>
    </body>
</html>
